<!DOCTYPE HTML>
<html lang="es">
	<head>
		<title>[Titulo]</title>
		<meta charset="UTF-8">
		<style>
			canvas{border:1px solid grey;}
		</style>
	</head>
	<body>
		<canvas></canvas>
		<input type="color" id="selectorcolor">
		<input type="range" id="grosortraso">
		<script>
			var pulsado = false
			let lienzo = document.querySelector("canvas");
			let contexto = lienzo.getContext("2d");
			let color = document.querySelector("#selectorcolor")
			let grosor = document.querySelector("#grosortraso")
			lienzo.width = 512
			lienzo.height = 512
			// CUANDO MUEVA EL RATON POR EL LIENZO
			lienzo.onmousemove = function(e){	
				if(pulsado){
					contexto.fillStyle = color.value
					contexto.fillRect(e.offsetX,e.offsetY,grosor.value,grosor.value)
				}
			}
			document.onmousedown = function(){
				pulsado = true
			}
			document.onmouseup = function(){
				pulsado = false;
			}
		</script>
	</body>
</html>
