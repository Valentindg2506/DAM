<!DOCTYPE HTML>
<html lang="es">
	<head>
		<title>[Titulo]</title>
		<meta charset="UTF-8">
	</head>
	<body>
		<canvas></canvas>
		<script>
			let lienzo = document.querySelector("canvas");
			let contexto = lienzo.getContext("2d");
			lienzo.width = 512;
			lienzo.height = 512;
			contexto.fillRect(40,40,60,60); // X,Y,W,H
			//CIRCULO
			contexto.beginPath();
			contexto.arc(150,150,50,0,Math.PI*2)// x,y,r,ang_inicio,ang_final
			contexto.fill()
		</script>
	</body>
</html>
