<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Inmobiliario - Sistema Completo</title>
    <style>
        :root {
            --bg: #0f1320;
            --panel: #141a2a;
            --panel-2: #182038;
            --muted: #9aa4b2;
            --text: #e8eefc;
            --primary: #5b8cff;
            --success: #2ecb70;
            --danger: #ff5d5d;
            --warning: #ffd166;
            --accent: #8a5bff;
            --border: #24304a;
            --shadow: 0 10px 30px rgba(0,0,0,.35);
            --radius: 14px;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(180deg, #0b0f1c 0%, #0f1320 100%);
            color: var(--text);
            min-height: 100vh;
        }
        
        .app {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }
        
        aside {
            background: linear-gradient(180deg, #12182a 0%, #0f1424 100%);
            border-right: 1px solid var(--border);
            padding: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        
        .logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: radial-gradient(120% 120% at 0% 0%, var(--accent) 0%, var(--primary) 35%, #1e2a44 100%);
            box-shadow: 0 6px 20px rgba(91,140,255,.35);
        }
        
        .brand h1 {
            font-size: 16px;
            font-weight: 700;
        }
        
        nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            color: var(--text);
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: .2s ease;
            border: 1px solid transparent;
            cursor: pointer;
        }
        
        nav a:hover {
            background: var(--panel);
            border-color: var(--border);
        }
        
        nav a.active {
            background: var(--panel-2);
            border-color: var(--border);
        }
        
        main {
            padding: 24px;
            overflow-y: auto;
        }
        
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--panel);
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            min-width: 280px;
        }
        
        .search input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            width: 100%;
        }
        
        .btn {
            appearance: none;
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            color: #fff;
            cursor: pointer;
            background: var(--panel);
            border: 1px solid var(--border);
            transition: .15s ease;
            font-weight: 600;
            font-size: 14px;
        }
        
        .btn:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn.primary {
            background: linear-gradient(180deg, #6b9eff, #4e7cf7);
            border-color: #365fcf;
        }
        
        .btn.success {
            background: linear-gradient(180deg, #35db80, #24c26e);
            border-color: #1ea45e;
        }
        
        .btn.danger {
            background: linear-gradient(180deg, #ff7a7a, #ff5d5d);
            border-color: #d94848;
        }
        
        .btn.warning {
            background: linear-gradient(180deg, #ffd97a, #ffcd5d);
            border-color: #d9a548;
            color: #333;
        }
        
        .card {
            background: linear-gradient(180deg, #12182a 0%, #101627 100%);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        
        .card-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card-header h2 {
            font-size: 18px;
            font-weight: 700;
        }
        
        .card-body {
            padding: 20px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
        }
        
        input, select, textarea {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }
        
        thead th {
            text-align: left;
            font-size: 12px;
            color: var(--muted);
            font-weight: 700;
            padding: 8px 12px;
            text-transform: uppercase;
        }
        
        tbody tr {
            background: linear-gradient(180deg, #141b31, #131a2e);
        }
        
        tbody td {
            padding: 12px;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        
        tbody tr td:first-child {
            border-left: 1px solid var(--border);
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
        }
        
        tbody tr td:last-child {
            border-right: 1px solid var(--border);
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid var(--border);
            background: var(--panel);
        }
        
        .badge.nuevo { background: #2a3f5f; color: #7fb3ff; border-color: #3d5980; }
        .badge.contactado { background: #2d3f5a; color: #7fd9ff; border-color: #3d5980; }
        .badge.calificado { background: #3f4f2a; color: #b3ff7f; border-color: #59803d; }
        .badge.propuesta { background: #5f3f2a; color: #ffd97f; border-color: #80593d; }
        .badge.cerrado { background: #2a5f3f; color: #7fffb3; border-color: #3d8059; }
        
        .badge.disponible { background: #2a5f3f; color: #7fffb3; }
        .badge.reservada { background: #5f3f2a; color: #ffd97f; }
        .badge.vendida { background: #3f2a5f; color: #d97fff; }
        
        .actions {
            display: flex;
            gap: 8px;
        }
        
        .btn-icon {
            padding: 6px 10px;
            font-size: 12px;
        }
        
        .pipeline-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
        
        .pipeline-column {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            min-height: 400px;
        }
        
        .pipeline-column h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: var(--muted);
            text-transform: uppercase;
            font-weight: 700;
        }
        
        .pipeline-card {
            background: linear-gradient(180deg, #1a2238, #151d31);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: .2s ease;
        }
        
        .pipeline-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        
        .pipeline-card h4 {
            font-size: 14px;
            margin-bottom: 6px;
        }
        
        .pipeline-card p {
            font-size: 12px;
            color: var(--muted);
            margin: 4px 0;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h2 {
            font-size: 20px;
        }
        
        .close {
            font-size: 28px;
            cursor: pointer;
            color: var(--muted);
        }
        
        .close:hover {
            color: var(--text);
        }
        
        .hidden {
            display: none !important;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }
        
        .empty {
            text-align: center;
            padding: 40px;
            color: var(--muted);
        }
        
        @media (max-width: 1024px) {
            .app {
                grid-template-columns: 1fr;
            }
            
            aside {
                position: static;
                height: auto;
            }
            
            .pipeline-board {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside>
            <div class="brand">
                <div class="logo"></div>
                <h1>CRM Inmobiliario</h1>
            </div>
            <nav>
                <a href="#" data-section="clientes" class="active">
                    📋 Clientes
                </a>
                <a href="#" data-section="propiedades">
                    🏠 Propiedades
                </a>
                <a href="#" data-section="pipeline">
                    📊 Pipeline
                </a>
                <a href="#" data-section="tareas">
                    ✅ Tareas
                </a>
            </nav>
            <div style="margin-top: 20px; font-size: 12px; color: var(--muted);">
                Sistema completo con MySQL
            </div>
        </aside>
        
        <main>
            <!-- SECCIÓN CLIENTES -->
            <section id="sec-clientes">
                <div class="toolbar">
                    <div class="search">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                            <path d="M21 21l-4.35-4.35m2.02-5.15a7.17 7.17 0 11-14.34 0 7.17 7.17 0 0114.34 0z" 
                                  stroke="#9aa4b2" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <input id="buscar-cliente" placeholder="Buscar clientes...">
                    </div>
                    <button class="btn primary" onclick="modalCliente.abrir()">+ Nuevo Cliente</button>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h2>Clientes</h2>
                        <span id="total-clientes" class="badge">0</span>
                    </div>
                    <div class="card-body">
                        <div id="tabla-clientes-container"></div>
                    </div>
                </div>
            </section>
            
            <!-- SECCIÓN PROPIEDADES -->
            <section id="sec-propiedades" class="hidden">
                <div class="toolbar">
                    <h2 style="font-size: 24px; font-weight: 700;">Propiedades</h2>
                    <button class="btn primary" onclick="modalPropiedad.abrir()">+ Nueva Propiedad</button>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h2>Inventario</h2>
                        <span id="total-propiedades" class="badge">0</span>
                    </div>
                    <div class="card-body">
                        <div id="tabla-propiedades-container"></div>
                    </div>
                </div>
            </section>
            
            <!-- SECCIÓN PIPELINE -->
            <section id="sec-pipeline" class="hidden">
                <div class="toolbar">
                    <h2 style="font-size: 24px; font-weight: 700;">Pipeline de Ventas</h2>
                    <button class="btn primary" onclick="cargarPipeline()">🔄 Actualizar</button>
                </div>
                
                <div id="pipeline-board" class="pipeline-board"></div>
            </section>
            
            <!-- SECCIÓN TAREAS -->
            <section id="sec-tareas" class="hidden">
                <div class="toolbar">
                    <h2 style="font-size: 24px; font-weight: 700;">Tareas y Seguimientos</h2>
                    <button class="btn primary" onclick="modalTarea.abrir()">+ Nueva Tarea</button>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h2>Agenda</h2>
                        <span id="total-tareas" class="badge">0</span>
                    </div>
                    <div class="card-body">
                        <div id="tabla-tareas-container"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    
    <!-- MODAL CLIENTE -->
    <div id="modal-cliente" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nuevo Cliente</h2>
                <span class="close" onclick="modalCliente.cerrar()">&times;</span>
            </div>
            <form id="form-cliente" onsubmit="return guardarCliente(event)">
                <div class="form-grid">
                    <div class="field">
                        <label>DNI/NIE *</label>
                        <input type="text" name="dni_nie" required>
                    </div>
                    <div class="field">
                        <label>Nombre *</label>
                        <input type="text" name="nombre" required>
                    </div>
                    <div class="field">
                        <label>Apellidos *</label>
                        <input type="text" name="apellidos" required>
                    </div>
                    <div class="field">
                        <label>Email</label>
                        <input type="email" name="email">
                    </div>
                    <div class="field">
                        <label>Teléfono</label>
                        <input type="tel" name="telefono">
                    </div>
                    <div class="field">
                        <label>Origen</label>
                        <select name="origen">
                            <option>Web</option>
                            <option>Recomendación</option>
                            <option>Anuncio</option>
                            <option>Redes Sociales</option>
                            <option>Otro</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Etapa Pipeline</label>
                        <select name="etapa_pipeline">
                            <option>Nuevo</option>
                            <option>Contactado</option>
                            <option>Calificado</option>
                            <option>Propuesta</option>
                            <option>Cerrado</option>
                        </select>
                    </div>
                </div>
                <div class="actions">
                    <button type="submit" class="btn success">Guardar</button>
                    <button type="button" class="btn" onclick="modalCliente.cerrar()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- MODAL PROPIEDAD -->
    <div id="modal-propiedad" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nueva Propiedad</h2>
                <span class="close" onclick="modalPropiedad.cerrar()">&times;</span>
            </div>
            <form id="form-propiedad" onsubmit="return guardarPropiedad(event)">
                <div class="form-grid">
                    <div class="field">
                        <label>Referencia *</label>
                        <input type="text" name="referencia" required>
                    </div>
                    <div class="field">
                        <label>Tipo *</label>
                        <select name="tipo" required>
                            <option>Venta</option>
                            <option>Alquiler</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Precio (€) *</label>
                        <input type="number" step="0.01" name="precio" required>
                    </div>
                    <div class="field">
                        <label>Superficie (m²)</label>
                        <input type="number" name="superficie">
                    </div>
                    <div class="field">
                        <label>Habitaciones</label>
                        <input type="number" name="habitaciones">
                    </div>
                    <div class="field">
                        <label>Baños</label>
                        <input type="number" name="banos">
                    </div>
                    <div class="field">
                        <label>Estado</label>
                        <select name="estado">
                            <option>Disponible</option>
                            <option>Reservada</option>
                            <option>Vendida</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>ID Propietario</label>
                        <input type="number" name="propietario_id" placeholder="Opcional">
                    </div>
                </div>
                <div class="field" style="grid-column: 1/-1;">
                    <label>Dirección *</label>
                    <input type="text" name="direccion" required>
                </div>
                <div class="actions" style="margin-top: 16px;">
                    <button type="submit" class="btn success">Guardar</button>
                    <button type="button" class="btn" onclick="modalPropiedad.cerrar()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- MODAL TAREA -->
    <div id="modal-tarea" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nueva Tarea</h2>
                <span class="close" onclick="modalTarea.cerrar()">&times;</span>
            </div>
            <form id="form-tarea" onsubmit="return guardarTarea(event)">
                <div class="form-grid">
                    <div class="field">
                        <label>ID Cliente *</label>
                        <input type="number" name="cliente_id" required>
                    </div>
                    <div class="field">
                        <label>Fecha y Hora *</label>
                        <input type="datetime-local" name="fecha_hora" required>
                    </div>
                </div>
                <div class="field">
                    <label>Título *</label>
                    <input type="text" name="titulo" required>
                </div>
                <div class="field">
                    <label>Descripción</label>
                    <textarea name="descripcion"></textarea>
                </div>
                <div class="actions" style="margin-top: 16px;">
                    <button type="submit" class="btn success">Guardar</button>
                    <button type="button" class="btn" onclick="modalTarea.cerrar()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        
        // Gestión de navegación
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const section = link.dataset.section;
                
                document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
                link.classList.add('active');
                
                document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
                document.getElementById(`sec-${section}`).classList.remove('hidden');
                
                // Cargar datos al cambiar sección
                if (section === 'clientes') cargarClientes();
                if (section === 'propiedades') cargarPropiedades();
                if (section === 'pipeline') cargarPipeline();
                if (section === 'tareas') cargarTareas();
            });
        });
        
        // Gestión de modales
        const modalCliente = {
            abrir: () => document.getElementById('modal-cliente').classList.add('active'),
            cerrar: () => {
                document.getElementById('modal-cliente').classList.remove('active');
                document.getElementById('form-cliente').reset();
            }
        };
        
        const modalPropiedad = {
            abrir: () => document.getElementById('modal-propiedad').classList.add('active'),
            cerrar: () => {
                document.getElementById('modal-propiedad').classList.remove('active');
                document.getElementById('form-propiedad').reset();
            }
        };
        
        const modalTarea = {
            abrir: () => document.getElementById('modal-tarea').classList.add('active'),
            cerrar: () => {
                document.getElementById('modal-tarea').classList.remove('active');
                document.getElementById('form-tarea').reset();
            }
        };
        
        // ========== CLIENTES ==========
        async function cargarClientes(filtro = '') {
            const container = document.getElementById('tabla-clientes-container');
            container.innerHTML = '<div class="loading">Cargando clientes...</div>';
            
            try {
                const url = filtro ? `${API_URL}/clientes?filtro=${encodeURIComponent(filtro)}` : `${API_URL}/clientes`;
                const res = await fetch(url);
                const clientes = await res.json();
                
                document.getElementById('total-clientes').textContent = clientes.length;
                
                if (clientes.length === 0) {
                    container.innerHTML = '<div class="empty">No hay clientes registrados</div>';
                    return;
                }
                
                container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>DNI/NIE</th>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Teléfono</th>
                                <th>Etapa</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${clientes.map(c => `
                                <tr>
                                    <td>${c.dni_nie}</td>
                                    <td>${c.nombre} ${c.apellidos}</td>
                                    <td>${c.email || '-'}</td>
                                    <td>${c.telefono || '-'}</td>
                                    <td><span class="badge ${c.etapa_pipeline.toLowerCase()}">${c.etapa_pipeline}</span></td>
                                    <td>
                                        <div class="actions">
                                            <button class="btn danger btn-icon" onclick="eliminarCliente(${c.id})">🗑️</button>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                container.innerHTML = '<div class="empty">Error al cargar clientes</div>';
                console.error(error);
            }
        }
        
        async function guardarCliente(e) {
            e.preventDefault();
            const form = e.target;
            const data = Object.fromEntries(new FormData(form));
            
            try {
                const res = await fetch(`${API_URL}/clientes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (res.ok) {
                    modalCliente.cerrar();
                    cargarClientes();
                    alert('Cliente guardado correctamente');
                } else {
                    alert('Error al guardar cliente');
                }
            } catch (error) {
                alert('Error de conexión');
                console.error(error);
            }
            
            return false;
        }
        
        async function eliminarCliente(id) {
            if (!confirm('¿Eliminar este cliente?')) return;
            
            try {
                await fetch(`${API_URL}/clientes/${id}`, { method: 'DELETE' });
                cargarClientes();
            } catch (error) {
                alert('Error al eliminar');
                console.error(error);
            }
        }
        
        // ========== PROPIEDADES ==========
        async function cargarPropiedades() {
            const container = document.getElementById('tabla-propiedades-container');
            container.innerHTML = '<div class="loading">Cargando propiedades...</div>';
            
            try {
                const res = await fetch(`${API_URL}/propiedades`);
                const propiedades = await res.json();
                
                document.getElementById('total-propiedades').textContent = propiedades.length;
                
                if (propiedades.length === 0) {
                    container.innerHTML = '<div class="empty">No hay propiedades registradas</div>';
                    return;
                }
                
                container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Referencia</th>
                                <th>Dirección</th>
                                <th>Tipo</th>
                                <th>Precio</th>
                                <th>m²</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${propiedades.map(p => `
                                <tr>
                                    <td>${p.referencia}</td>
                                    <td>${p.direccion}</td>
                                    <td>${p.tipo}</td>
                                    <td>${Number(p.precio).toLocaleString('es-ES')} €</td>
                                    <td>${p.superficie || '-'}</td>
                                    <td><span class="badge ${p.estado.toLowerCase()}">${p.estado}</span></td>
                                    <td>
                                        <button class="btn danger btn-icon" onclick="eliminarPropiedad(${p.id})">🗑️</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                container.innerHTML = '<div class="empty">Error al cargar propiedades</div>';
                console.error(error);
            }
        }
        
        async function guardarPropiedad(e) {
            e.preventDefault();
            const form = e.target;
            const data = Object.fromEntries(new FormData(form));
            
            // Convertir valores numéricos
            if (data.propietario_id && data.propietario_id.trim() === '') delete data.propietario_id;
            if (data.propietario_id) data.propietario_id = parseInt(data.propietario_id);
            data.precio = parseFloat(data.precio);
            if (data.superficie) data.superficie = parseInt(data.superficie);
            if (data.habitaciones) data.habitaciones = parseInt(data.habitaciones);
            if (data.banos) data.banos = parseInt(data.banos);
            
            try {
                const res = await fetch(`${API_URL}/propiedades`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (res.ok) {
                    modalPropiedad.cerrar();
                    cargarPropiedades();
                    alert('Propiedad guardada correctamente');
                } else {
                    alert('Error al guardar propiedad');
                }
            } catch (error) {
                alert('Error de conexión');
                console.error(error);
            }
            
            return false;
        }
        
        async function eliminarPropiedad(id) {
            if (!confirm('¿Eliminar esta propiedad?')) return;
            
            try {
                await fetch(`${API_URL}/propiedades/${id}`, { method: 'DELETE' });
                cargarPropiedades();
            } catch (error) {
                alert('Error al eliminar');
                console.error(error);
            }
        }
        
        // ========== PIPELINE ==========
        async function cargarPipeline() {
            const board = document.getElementById('pipeline-board');
            board.innerHTML = '<div class="loading">Cargando pipeline...</div>';
            
            try {
                const res = await fetch(`${API_URL}/pipeline`);
                const pipeline = await res.json();
                
                const etapas = ['Nuevo', 'Contactado', 'Calificado', 'Propuesta', 'Cerrado'];
                
                board.innerHTML = etapas.map(etapa => `
                    <div class="pipeline-column" data-etapa="${etapa}">
                        <h3>${etapa} (${pipeline[etapa]?.length || 0})</h3>
                        ${(pipeline[etapa] || []).map(c => `
                            <div class="pipeline-card" data-id="${c.id}">
                                <h4>${c.nombre} ${c.apellidos}</h4>
                                <p>📄 ${c.dni_nie}</p>
                                <p>📧 ${c.email || 'Sin email'}</p>
                                <p>📱 ${c.telefono || 'Sin teléfono'}</p>
                                <select class="btn btn-icon" style="margin-top:8px; width:100%;" 
                                        onchange="cambiarEtapa(${c.id}, this.value)">
                                    ${etapas.map(e => `<option value="${e}" ${e === etapa ? 'selected' : ''}>${e}</option>`).join('')}
                                </select>
                            </div>
                        `).join('')}
                    </div>
                `).join('');
            } catch (error) {
                board.innerHTML = '<div class="empty">Error al cargar pipeline</div>';
                console.error(error);
            }
        }
        
        async function cambiarEtapa(id, nuevaEtapa) {
            try {
                await fetch(`${API_URL}/clientes/${id}/etapa`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ etapa: nuevaEtapa })
                });
                cargarPipeline();
            } catch (error) {
                alert('Error al cambiar etapa');
                console.error(error);
            }
        }
        
        // ========== TAREAS ==========
        async function cargarTareas() {
            const container = document.getElementById('tabla-tareas-container');
            container.innerHTML = '<div class="loading">Cargando tareas...</div>';
            
            try {
                const res = await fetch(`${API_URL}/tareas`);
                const tareas = await res.json();
                
                document.getElementById('total-tareas').textContent = tareas.length;
                
                if (tareas.length === 0) {
                    container.innerHTML = '<div class="empty">No hay tareas programadas</div>';
                    return;
                }
                
                container.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Fecha/Hora</th>
                                <th>Cliente</th>
                                <th>Título</th>
                                <th>Descripción</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tareas.map(t => `
                                <tr style="${t.completada ? 'opacity:0.6' : ''}">
                                    <td>${new Date(t.fecha_hora).toLocaleString('es-ES')}</td>
                                    <td>${t.cliente_nombre} ${t.cliente_apellidos}</td>
                                    <td>${t.titulo}</td>
                                    <td>${t.descripcion || '-'}</td>
                                    <td>
                                        <input type="checkbox" class="checkbox" 
                                               ${t.completada ? 'checked' : ''} 
                                               onchange="toggleTarea(${t.id})">
                                    </td>
                                    <td>
                                        <button class="btn danger btn-icon" onclick="eliminarTarea(${t.id})">🗑️</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                container.innerHTML = '<div class="empty">Error al cargar tareas</div>';
                console.error(error);
            }
        }
        
        async function guardarTarea(e) {
            e.preventDefault();
            const form = e.target;
            const data = Object.fromEntries(new FormData(form));
            data.cliente_id = parseInt(data.cliente_id);
            
            try {
                const res = await fetch(`${API_URL}/tareas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (res.ok) {
                    modalTarea.cerrar();
                    cargarTareas();
                    alert('Tarea guardada correctamente');
                } else {
                    alert('Error al guardar tarea');
                }
            } catch (error) {
                alert('Error de conexión');
                console.error(error);
            }
            
            return false;
        }
        
        async function toggleTarea(id) {
            try {
                await fetch(`${API_URL}/tareas/${id}/completar`, { method: 'PUT' });
                cargarTareas();
            } catch (error) {
                alert('Error al actualizar');
                console.error(error);
            }
        }
        
        async function eliminarTarea(id) {
            if (!confirm('¿Eliminar esta tarea?')) return;
            
            try {
                await fetch(`${API_URL}/tareas/${id}`, { method: 'DELETE' });
                cargarTareas();
            } catch (error) {
                alert('Error al eliminar');
                console.error(error);
            }
        }
        
        // Búsqueda de clientes
        let timeoutBusqueda;
        document.getElementById('buscar-cliente').addEventListener('input', (e) => {
            clearTimeout(timeoutBusqueda);
            timeoutBusqueda = setTimeout(() => {
                cargarClientes(e.target.value);
            }, 300);
        });
        
        // Carga inicial
        cargarClientes();
    </script>
</body>
</html>
